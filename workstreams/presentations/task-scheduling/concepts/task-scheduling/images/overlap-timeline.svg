<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">START TIMES CAN OVERLAP</title><desc id="desc">Illustrative slide 6 example  |  Each job lasts 30 minutes; a new one starts every 10</desc><rect width="1200" height="470" rx="24" fill="#101b32"/>
