<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="454" viewBox="0 0 1000 454"><rect width="1000" height="454" fill="#101827"/><g font-family="Arial, sans-serif"><text x="50" y="55" fill="#fbbf24" font-size="30" font-weight="bold">Three keys to an LMS action</text><rect x="50" y="85" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="116" fill="#93c5fd" font-size="23" font-weight="bold">1. Identity badge — authentication</text><text x="75" y="146" fill="#ffffff" font-size="20">Who are you? Verified JWT supplies trusted identity.</text><path d="M500 170 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="193" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="224" fill="#93c5fd" font-size="23" font-weight="bold">2. Role gate — permission</text><text x="75" y="254" fill="#ffffff" font-size="20">May your role perform this action? Trainer / admin allowlist.</text><path d="M500 278 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="301" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="332" fill="#93c5fd" font-size="23" font-weight="bold">3. Course key — ownership</text><text x="75" y="362" fill="#ffffff" font-size="20">Which course? Trainer uses own course; admin follows supervision policy.</text></g></svg>