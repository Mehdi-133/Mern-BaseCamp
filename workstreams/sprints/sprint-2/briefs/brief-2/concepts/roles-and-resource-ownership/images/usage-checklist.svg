<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="562" viewBox="0 0 1000 562"><rect width="1000" height="562" fill="#101827"/><g font-family="Arial, sans-serif"><text x="50" y="55" fill="#fbbf24" font-size="30" font-weight="bold">Apply the policy, then prove it</text><rect x="50" y="85" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="116" fill="#93c5fd" font-size="23" font-weight="bold">1. Define the action and resource</text><text x="75" y="146" fill="#ffffff" font-size="20">List allowed roles and the course ownership rule.</text><path d="M500 170 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="193" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="224" fill="#93c5fd" font-size="23" font-weight="bold">2. Arrange the route checks</text><text x="75" y="254" fill="#ffffff" font-size="20">Authentication → role → resource scope → controller.</text><path d="M500 278 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="301" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="332" fill="#93c5fd" font-size="23" font-weight="bold">3. Follow parent relationships</text><text x="75" y="362" fill="#ffffff" font-size="20">Module / resource → parent course → stored owner.</text><path d="M500 386 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="409" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="440" fill="#93c5fd" font-size="23" font-weight="bold">4. Record allowed and refused API results</text><text x="75" y="470" fill="#ffffff" font-size="20">Check no token, wrong role, other owner, own course, and admin.</text></g></svg>