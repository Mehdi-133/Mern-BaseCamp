<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Brief 3 dependency route to a React-ready LMS API</title>
  <desc id="desc">Five connected delivery stages move from stabilizing Brief 2 through LMS domain features, automation, React contracts, and verified delivery. Security, predictable errors, and contribution evidence cross every stage.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07142f"/>
      <stop offset="1" stop-color="#152853"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1080" cy="75" r="130" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="115" cy="610" r="155" fill="#8b5cf6" opacity="0.08"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="58" font-size="31" font-weight="700" fill="#f8fafc">Brief 3 — Build the final LMS API in dependency order</text>
    <text x="60" y="90" font-size="17" fill="#cbd5e1">Stabilize what exists, add trusted backend behavior, then prove a contract React can consume.</text>

    <line x1="145" y1="268" x2="1054" y2="268" stroke="url(#trail)" stroke-width="6" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="42" y="165" width="190" height="205" rx="22" fill="#0f2748" stroke="#22d3ee" stroke-width="2"/>
      <circle cx="82" cy="205" r="23" fill="#0891b2"/>
      <text x="82" y="213" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
      <text x="118" y="202" font-size="19" font-weight="700" fill="#67e8f9">Stabilize</text>
      <text x="62" y="246" font-size="14" fill="#e2e8f0">Brief 2 baseline</text>
      <text x="62" y="274" font-size="14" fill="#e2e8f0">Install + seed + start</text>
      <text x="62" y="302" font-size="14" fill="#e2e8f0">Auth + roles + upload</text>
      <text x="62" y="330" font-size="14" fill="#e2e8f0">Progress + regressions</text>

      <rect x="266" y="165" width="190" height="205" rx="22" fill="#211d4e" stroke="#818cf8" stroke-width="2"/>
      <circle cx="306" cy="205" r="23" fill="#4f46e5"/>
      <text x="306" y="213" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
      <text x="342" y="202" font-size="19" font-weight="700" fill="#a5b4fc">Learning domain</text>
      <text x="286" y="246" font-size="14" fill="#e2e8f0">Quiz + safe questions</text>
      <text x="286" y="274" font-size="14" fill="#e2e8f0">Attempts + backend score</text>
      <text x="286" y="302" font-size="14" fill="#e2e8f0">Required / optional gate</text>
      <text x="286" y="330" font-size="14" fill="#e2e8f0">Trainer feedback</text>

      <rect x="490" y="165" width="190" height="205" rx="22" fill="#3a174d" stroke="#f472b6" stroke-width="2"/>
      <circle cx="530" cy="205" r="23" fill="#db2777"/>
      <text x="530" y="213" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text>
      <text x="566" y="202" font-size="19" font-weight="700" fill="#f9a8d4">Automate</text>
      <text x="510" y="246" font-size="14" fill="#e2e8f0">Five email events</text>
      <text x="510" y="274" font-size="14" fill="#e2e8f0">Templates + log driver</text>
      <text x="510" y="302" font-size="14" fill="#e2e8f0">Admin + trainer settings</text>
      <text x="510" y="330" font-size="14" fill="#e2e8f0">Jobs + run history</text>

      <rect x="714" y="165" width="190" height="205" rx="22" fill="#40210d" stroke="#fb923c" stroke-width="2"/>
      <circle cx="754" cy="205" r="23" fill="#ea580c"/>
      <text x="754" y="213" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">4</text>
      <text x="790" y="202" font-size="19" font-weight="700" fill="#fdba74">Contract</text>
      <text x="734" y="246" font-size="14" fill="#e2e8f0">Stable endpoints</text>
      <text x="734" y="274" font-size="14" fill="#e2e8f0">Predictable errors</text>
      <text x="734" y="302" font-size="14" fill="#e2e8f0">Scoped statistics</text>
      <text x="734" y="330" font-size="14" fill="#e2e8f0">React examples + seed</text>

      <rect x="938" y="165" width="220" height="205" rx="22" fill="#0c352d" stroke="#34d399" stroke-width="2"/>
      <circle cx="978" cy="205" r="23" fill="#059669"/>
      <text x="978" y="213" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">5</text>
      <text x="1014" y="202" font-size="19" font-weight="700" fill="#6ee7b7">Prove + deliver</text>
      <text x="958" y="246" font-size="14" fill="#e2e8f0">Automated tests</text>
      <text x="958" y="274" font-size="14" fill="#e2e8f0">Postman + OpenAPI</text>
      <text x="958" y="302" font-size="14" fill="#e2e8f0">Docker + README</text>
      <text x="958" y="330" font-size="14" fill="#e2e8f0">PRs + named evidence</text>
    </g>

    <rect x="88" y="430" width="1024" height="120" rx="24" fill="#0b1f3b" stroke="#60a5fa" stroke-width="2"/>
    <text x="120" y="469" font-size="19" font-weight="700" fill="#93c5fd">Safety rope across every stage</text>
    <g font-size="15" fill="#e2e8f0">
      <text x="120" y="508">No answer leaks</text>
      <text x="314" y="508">Backend-owned scores</text>
      <text x="544" y="508">Role + ownership</text>
      <text x="742" y="508">Secrets stay in env</text>
      <text x="942" y="508">Visible contributions</text>
    </g>
    <g fill="#60a5fa">
      <circle cx="105" cy="503" r="5"/><circle cx="299" cy="503" r="5"/><circle cx="529" cy="503" r="5"/><circle cx="727" cy="503" r="5"/><circle cx="927" cy="503" r="5"/>
    </g>

    <rect x="215" y="586" width="770" height="52" rx="18" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
    <text x="600" y="619" text-anchor="middle" font-size="16" font-weight="700" fill="#ddd6fe">First checkpoint: prove the inherited baseline before choosing a new feature branch.</text>
  </g>
</svg>
