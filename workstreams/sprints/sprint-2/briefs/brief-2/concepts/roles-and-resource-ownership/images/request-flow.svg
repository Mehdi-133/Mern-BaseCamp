<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670"><rect width="1000" height="670" fill="#101827"/><g font-family="Arial, sans-serif"><text x="50" y="55" fill="#fbbf24" font-size="30" font-weight="bold">Protected course action — target workflow</text><rect x="50" y="85" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="116" fill="#93c5fd" font-size="23" font-weight="bold">1. Authenticate the request</text><text x="75" y="146" fill="#ffffff" font-size="20">Missing / invalid authentication → 401; otherwise set req.user.</text><path d="M500 170 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="193" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="224" fill="#93c5fd" font-size="23" font-weight="bold">2. Check the allowed role</text><text x="75" y="254" fill="#ffffff" font-size="20">Role refused → 403; role accepted → continue.</text><path d="M500 278 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="301" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="332" fill="#93c5fd" font-size="23" font-weight="bold">3. Load the target course</text><text x="75" y="362" fill="#ffffff" font-size="20">Course absent → 404; course exists → check its stored owner.</text><path d="M500 386 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="409" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="440" fill="#93c5fd" font-size="23" font-weight="bold">4. Apply the resource policy</text><text x="75" y="470" fill="#ffffff" font-size="20">Admin passes scope; trainer must match owner; mismatch → 403.</text><path d="M500 494 v18 m-6 -6 l6 6 6 -6" stroke="#fbbf24" fill="none" stroke-width="3"/><rect x="50" y="517" width="900" height="82" rx="14" fill="#24334b"/><text x="75" y="548" fill="#93c5fd" font-size="23" font-weight="bold">5. Perform the requested action</text><text x="75" y="578" fill="#ffffff" font-size="20">Controller runs only after the checks; return the action result.</text></g></svg>